<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Facet gradients for realistic glass prism feel -->
    <linearGradient id="prismFaceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="prismFaceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="prismBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 0)">
    <!-- 5 Refracted Light Rays (Rainbow Spectrum) -->
    <!-- Ray 1: Deep Blue -->
    <polygon points="230,172 405,110 395,138 232,178" fill="#2563eb" />
    <!-- Ray 2: Teal / Green -->
    <polygon points="232,179 403,143 392,170 234,185" fill="#0d9488" />
    <!-- Ray 3: Warm Yellow -->
    <polygon points="234,186 400,174 388,201 236,192" fill="#f59e0b" />
    <!-- Ray 4: Coral Orange -->
    <polygon points="236,193 396,206 383,232 238,198" fill="#f97316" />
    <!-- Ray 5: Soft Violet / Lavender -->
    <polygon points="238,199 391,237 378,262 240,203" fill="#8b5cf6" />

    <!-- Light entrance small white highlight -->
    <polygon points="214,170 230,172 240,203 218,195" fill="#ffffff" opacity="0.9" />

    <!-- 3D Pyramid Prism Glass Body -->
    <!-- Base triangle inside/reflection -->
    <polygon points="120,240 185,275 285,248" fill="url(#prismBase)" />
    <!-- Internal back base edge -->
    <line x1="120" y1="240" x2="200" y2="175" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
    <line x1="285" y1="248" x2="200" y2="175" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
    <line x1="205" y1="90" x2="200" y2="175" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4,4" />

    <!-- Left Front Facet -->
    <polygon points="205,90 120,240 185,275" fill="url(#prismFaceLeft)" stroke="#0f172a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Right Front Facet -->
    <polygon points="205,90 185,275 285,248" fill="url(#prismFaceRight)" stroke="#0f172a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />

    <!-- External Base contour and apex accent lines -->
    <line x1="120" y1="240" x2="185" y2="275" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="185" y1="275" x2="285" y2="248" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="205" y1="90" x2="185" y2="275" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="205" y1="90" x2="120" y2="240" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="205" y1="90" x2="285" y2="248" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />

    <!-- Subtle glass specular reflection highlights on the apex & left crest -->
    <line x1="203" y1="102" x2="132" y2="230" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography: PRISMA with stylized triangular Chevron 'A' -->
  <g transform="translate(85, 360)">
    <!-- P -->
    <path d="M 12 0 L 12 40 M 12 0 L 28 0 C 36 0 40 4 40 11 C 40 18 36 22 28 22 L 12 22" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R -->
    <path d="M 68 0 L 68 40 M 68 0 L 84 0 C 92 0 96 4 96 11 C 96 18 92 22 84 22 L 68 22 M 82 22 L 98 40" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- I -->
    <path d="M 132 0 L 132 40" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
    <!-- S -->
    <path d="M 194 6 C 188 0 178 0 170 3 C 160 8 160 16 166 20 L 186 24 C 196 27 196 36 188 40 C 180 43 166 43 158 36" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- M -->
    <path d="M 224 40 L 224 0 L 244 26 L 264 0 L 264 40" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- A (Stylized Chevron Lambda) -->
    <path d="M 292 40 L 314 0 L 336 40" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
